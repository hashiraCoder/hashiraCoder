name: generate animation

on:
  # run automatically every 24 hours
  schedule:
    - cron: "0 0 * * *" 
  
  # allows to manually run the job at any time
  workflow_dispatch:
  
  # run on every push on the main branch
  push:
    branches:
    - main
    
jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # generates a snake game from a github userI have generated the complete animated GitHub profile README system you requested. Here is a summary of the files delivered:

1.  **`banner.svg`**: The main dark mode banner. It features a dark pink/purple gradient background with ambient orbs, rising particles, and twinkling sparkles. The interface includes:
    *   An isolated version of your anime-style character and desk with special one-time holographic and continuous full-width horizontal scanning reveals, clipped to the banner's rounded corners.
    *   A terminal window typing "user@dev:~$ cat README.md".
    *   Your name, **Shivam Kumar**, as an animated pink-to-purple vector script font.
    *   A quote box typing your tagline: "Building Scalable Web Applications and Learning Cloud | Exploring Devops."
    *   Cycling role titles.
    *   Animated tech-stack pills (C++, JavaScript, React, etc.) with hover effects.
    *   Typed About Me lines and an animated stats bar.
    *   A code-editor card typing out a fun `buildDreams()` JSX snippet.
    *   A neon sign flickering with "KEEP CODING KEEP GROWING".

2.  **`banner-light.svg`**: A recolored version of the banner designed to blend into a white GitHub page when the light theme is active.

3.  **`lanyard.svg`**: A pure SVG animated swinging ID badge. It features:
    *   A pink strap with your printed details.
    *   A dark frosted glass card with your portrait cropped from the input image, set inside a glowing avatar ring with digital scan-lines.
    *   Your name, full role title, handle, a barcode, and a holographic sine-wave animation sweep.
    *   Physics-based animation: a drop-in, damped pendulum swing, and perpetual gentle sway.

4.  **Local Stat Cards**: These three SVGs are complete and designed for local hosting to avoid API limits.
    *   **`stats.svg`**: Features a large animated rank ring (Rank: A+) with data rows sliding in sequentially.
    *   **`langs.svg`**: Displays animated progress bars for your most used languages (C++, JS, React, etc.).
    *   **`trophies.svg`**: A 3x3 grid of trophy cells, each popping in one by one with glowing ranks and a holographic shine sweep across the grid.

All files are provided as individual downloadable images within the interaction. To complete the setup, please save the text content below into the required non-image files in your repository:

