<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="740" viewBox="0 0 1280 740" role="img" aria-label="Animated introduction for Shivam Kumar">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#160b29"/><stop offset=".48" stop-color="#35134c"/><stop offset="1" stop-color="#081c32"/></linearGradient><linearGradient id="ink"><stop stop-color="#ff5ca8"/><stop offset=".55" stop-color="#df75ff"/><stop offset="1" stop-color="#a88cff"/></linearGradient><linearGradient id="glass" x2="0" y2="1"><stop stop-color="#ffffff" stop-opacity=".15"/><stop offset="1" stop-color="#ffb5de" stop-opacity=".02"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><clipPath id="round"><rect width="1280" height="740" rx="30"/></clipPath><clipPath id="portrait"><rect x="855" y="154" width="350" height="515" rx="26"/></clipPath>
<style><![CDATA[.mono{font-family:ui-monospace,Consolas,monospace}.sans{font-family:Arial,sans-serif}.muted{fill:#d9c9ed}.small{font-size:15px}.line{stroke:#f57abb;stroke-width:2}.cursor{animation:blink .85s step-end infinite}.type{overflow:hidden;animation:reveal 2.3s steps(32,end) both}.p{opacity:0;animation:pop .5s ease-out forwards}.p1{animation-delay:1.7s}.p2{animation-delay:1.9s}.p3{animation-delay:2.1s}.p4{animation-delay:2.3s}.p5{animation-delay:2.5s}.p6{animation-delay:2.7s}.role{opacity:0;animation:roles 9s infinite}.r2{animation-delay:3s}.r3{animation-delay:6s}.code{opacity:0;animation:code 12s infinite}.c2{animation-delay:1.2s}.c3{animation-delay:2.4s}.c4{animation-delay:3.6s}.c5{animation-delay:4.8s}.c6{animation-delay:6s}.spark{animation:twinkle 2.2s infinite}.float{animation:float 5s ease-in-out infinite}.scan{animation:scan 3.5s linear infinite}.holo{animation:form 2.8s ease-out both}.intro{animation:introScan 2.8s ease-out both}.neon{animation:flicker 4s 2s infinite}.bar{transform-origin:left;animation:bar 2s 1.6s both}.pill:hover{filter:brightness(1.35);transform:translateY(-4px)}@keyframes blink{50%{opacity:0}}@keyframes reveal{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0)}}@keyframes pop{to{opacity:1}}@keyframes roles{0%,28%{opacity:0;transform:translateY(9px)}5%,25%{opacity:1;transform:translateY(0)}33%,100%{opacity:0}}@keyframes code{0%,9%,100%{opacity:0}12%,30%{opacity:1}}@keyframes twinkle{50%{opacity:.15;transform:scale(.45)}}@keyframes float{50%{transform:translateY(-15px)}}@keyframes scan{0%{transform:translateY(-12px);opacity:0}8%,92%{opacity:1}100%{transform:translateY(752px);opacity:0}}@keyframes form{0%{opacity:0;clip-path:inset(0 0 100% 0);filter:brightness(3)}100%{opacity:1;clip-path:inset(0);filter:brightness(1)}}@keyframes introScan{0%,80%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(530px)}}@keyframes flicker{0%,92%,100%{opacity:1}93%{opacity:.25}95%{opacity:.75}97%{opacity:.15}}@keyframes bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}]]></style></defs>
