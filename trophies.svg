<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="180" viewBox="0 0 1020 180" role="img" aria-label="Developer milestones"><defs><linearGradient id="g"><stop stop-color="#ff75b7"/><stop offset="1" stop-color="#9569ff"/></linearGradient><style><![CDATA[.t{font-family:Arial,sans-serif}.cell{opacity:0;animation:p .55s forwards}.d2{animation-delay:.15s}.d3{animation-delay:.3s}.d4{animation-delay:.45s}.sh{animation:sh 3s infinite}@keyframes p{to{opacity:1;transform:scale(1)}}@keyframes sh{from{transform:translateX(-300px)}to{transform:translateX(1100px)}}]]></style></defs><rect width="1020" height="180" rx="20" fill="#121328" stroke="#a55dda"/><text x="25" y="35" class="t" fill="#fff" font-size="18" font-weight="700">Milestones &amp; Trophies</text><g class="t" text-anchor="middle"><g class="cell" transform="translate(35 55)"><rect width="210" height="95" rx="14" fill="#242044"/><text x="105" y="43" font-size="28" fill="url(#g)">✦</text><text x="105" y="70" fill="#fff" font-size="14">OPEN SOURCE</text></g><g class="cell d2" transform="translate(280 55)"><rect width="210" height="95" rx="14" fill="#242044"/><text x="105" y="43" font-size="28" fill="url(#g)">⌘</text><text x="105" y="70" fill="#fff" font-size="14">BUILDER</text></g><g class="cell d3" transform="translate(525 55)"><rect width="210" height="95" rx="14" fill="#242044"/><text x="105" y="43" font-size="28" fill="url(#g)">⚡</text><text x="105" y="70" fill="#fff" font-size="14">FAST LEARNER</text></g><g class="cell d4" transform="translate(770 55)"><rect width="210" height="95" rx="14" fill="#242044"/><text x="105" y="43" font-size="28" fill="url(#g)">♥</text><text x="105" y="70" fill="#fff" font-size="14">CONSISTENT</text></g></g><rect class="sh" y="0" width="70" height="180" fill="#fff" opacity=".06" transform="skewX(-20)"/></svg>
