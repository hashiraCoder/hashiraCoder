<svg xmlns="http://www.w3.org/2000/svg" width="495" height="250" viewBox="0 0 495 250" role="img" aria-label="GitHub profile statistics"><style><![CDATA[.t{font-family:Arial,sans-serif}.row{opacity:0;animation:i .6s forwards}.r2{animation-delay:.25s}.r3{animation-delay:.5s}.ring{stroke-dasharray:440;stroke-dashoffset:440;animation:ring 2s forwards}@keyframes i{to{opacity:1;transform:translateX(0)}}@keyframes ring{to{stroke-dashoffset:105}}]]></style><rect width="495" height="250" rx="20" fill="#121328" stroke="#a55dda"/><text x="25" y="37" class="t" fill="#fff" font-size="18" font-weight="700">GitHub Snapshot</text><circle cx="88" cy="139" r="57" fill="none" stroke="#332c53" stroke-width="12"/><circle cx="88" cy="139" r="57" fill="none" stroke="#ef6cac" stroke-width="12" transform="rotate(-90 88 139)" class="ring"/><text x="88" y="146" text-anchor="middle" class="t" fill="#fff" font-size="24" font-weight="700">A+</text><g class="t row" transform="translate(180 82)"><text fill="#e6c9fa" font-size="14">REPOSITORIES</text><text x="230" fill="#fff" font-size="19" font-weight="700">—</text></g><g class="t row r2" transform="translate(180 128)"><text fill="#e6c9fa" font-size="14">COMMITS</text><text x="230" fill="#fff" font-size="19" font-weight="700">—</text></g><g class="t row r3" transform="translate(180 174)"><text fill="#e6c9fa" font-size="14">FOCUS</text><text x="230" fill="#ff9fca" font-size="16" font-weight="700">BUILDING</text></g><text x="25" y="225" class="t" fill="#9f91bb" font-size="12">Static card · update numbers as your profile grows</text></svg>
